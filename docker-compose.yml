version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: insightiq_postgres
    restart: always
    environment:
      POSTGRES_USER: insightiq_user
      POSTGRES_PASSWORD: insightiq_password
      POSTGRES_DB: insightiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightiq_user -d insightiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insightiq_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://insightiq_user:insightiq_password@postgres:5432/insightiq
      SECRET_KEY: ${SECRET_KEY:-insightiq-super-secret-production-jwt-key-2026}
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insightiq_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
